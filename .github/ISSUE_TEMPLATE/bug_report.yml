name: Bug report
description: Something doesn't work as expected, or your Mac shows "Unsupported".
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Choose **Copy Diagnostics** from the LidBlur menu and paste the result here.
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: External displays, screen recording, other apps, or a short video of the effect.
