name: CI
on: [push, pull_request]
jobs:
  test:
    # macos-15 ships Xcode 16 / Swift 6; macos-14 defaults to Swift 5.10, which can't read swift-tools-version 6.0.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: swift build -c release --arch arm64
